spring.application.name=Na Tomada

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL)
# SECURITY: No default password - must be set via environment variable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/natomada}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# Redis Configuration
# SECURITY: No default password - must be set via environment variable
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# Session Configuration (Redis)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=natomada:session
spring.session.redis.flush-mode=on-save

# Security Logging
# SECURITY: Use INFO in production. Set to DEBUG only for development troubleshooting.
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.springframework.security.web=${LOGGING_LEVEL_SECURITY_WEB:INFO}

# Kafka Configuration
# Set to true to enable Kafka (requires Kafka and Zookeeper running)
kafka.enabled=${KAFKA_ENABLED:false}

# Disable Spring Boot Kafka auto-configuration when kafka.enabled=false
spring.autoconfigure.exclude=${KAFKA_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:natomada-group}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT Configuration
# SECURITY: JWT_SECRET must be set in environment - no default value for security
jwt.secret=${JWT_SECRET}
jwt.expires-in=${JWT_EXPIRES_IN:3600000}

# Actuator Configuration (for health checks)
# SECURITY: Only expose health endpoints publicly. Metrics require authentication.
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.health.mail.enabled=false
# Kubernetes-style health probes
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=db,redis
# Disable sensitive endpoints
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.mappings.enabled=false

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:na-tomada-s3-bucket}
aws.s3.region=${AWS_REGION:us-east-2}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.barbatech.natomada=${LOGGING_LEVEL_COM_BARBATECH:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# OpenAPI/Swagger Configuration
# SECURITY: Disabled by default in production. Set SWAGGER_ENABLED=true for development.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.packages-to-scan=com.barbatech.natomada
springdoc.show-actuator=false

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.hostinger.com}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
# For development: log emails to console instead of sending
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Application Email Settings
app.email.from=${APP_EMAIL_FROM:noreply@natomada.com}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# SMS Configuration (Integraflux)
sms.integraflux.base-url=${SMS_INTEGRAFLUX_BASE_URL:https://sms.aresfun.com}
sms.integraflux.token=${SMS_INTEGRAFLUX_TOKEN:}
sms.integraflux.enabled=${SMS_INTEGRAFLUX_ENABLED:true}

# External APIs - OpenChargeMap
opencm.api.key=${OPENCM_API_KEY:}
opencm.api.base-url=${OPENCM_BASE_URL:https://api.openchargemap.io/v3}

# External APIs - Google Places
google.places.api.key=${GOOGLE_PLACES_API_KEY:}

# CORS Configuration
# Comma-separated list of allowed origins (e.g., http://localhost:3000,https://natomada.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Security Headers Configuration
# HSTS (HTTP Strict Transport Security) - Enable only when using HTTPS in production
security.headers.hsts.enabled=${SECURITY_HSTS_ENABLED:false}
security.headers.hsts.max-age=${SECURITY_HSTS_MAX_AGE:31536000}
security.headers.hsts.include-subdomains=${SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
# CSP (Content Security Policy) - Configure based on your frontend requirements
security.headers.csp.enabled=${SECURITY_CSP_ENABLED:false}
security.headers.csp.policy=${SECURITY_CSP_POLICY:default-src 'self'}

# Rate Limiting Configuration
# Login: 5 attempts per 15 minutes per IP
rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-duration-minutes=15
# OTP Send: 3 attempts per hour per phone/email
rate-limit.otp.capacity=3
rate-limit.otp.refill-tokens=3
rate-limit.otp.refill-duration-minutes=60
# General Auth: 20 requests per minute per IP
rate-limit.auth.capacity=20
rate-limit.auth.refill-tokens=20
rate-limit.auth.refill-duration-minutes=1
# SECURITY: Trusted proxies for X-Forwarded-For validation
# Only requests from these IPs will have their forwarded headers honored
# Configure your load balancer/reverse proxy IPs here (CIDR notation supported)
rate-limit.trusted-proxies=${TRUSTED_PROXIES:}

# Internationalization (i18n)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# In-App Purchase Configuration
# Google Play Store
google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:com.barbatech.natomada}
google.play.enabled=${GOOGLE_PLAY_VERIFICATION_ENABLED:false}

# Apple App Store
apple.app-store.enabled=${APPLE_APP_STORE_VERIFICATION_ENABLED:false}
apple.app-store.shared-secret=${APPLE_APP_STORE_SHARED_SECRET:}
apple.app-store.verify-url=https://buy.itunes.apple.com/verifyReceipt
apple.app-store.sandbox-url=https://sandbox.itunes.apple.com/verifyReceipt
