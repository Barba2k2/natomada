# Prometheus Configuration for Na Tomada Application
global:
  scrape_interval: 15s # How often to scrape targets
  evaluation_interval: 15s # How often to evaluate rules
  external_labels:
    cluster: 'natomada-prod'
    environment: 'production'

# Scrape configurations
scrape_configs:
  # Spring Boot Application Metrics
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'metrics'
      password: 'Barba2024@Metrics'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'natomada-api'
          service: 'backend'

  # PostgreSQL Metrics (optional - requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
    # Only scrape if postgres-exporter is enabled
    # Can be commented out if not using

  # Redis Metrics (optional - requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    # Only scrape if redis-exporter is enabled
    # Can be commented out if not using

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

# Alerting configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (optional)
# rule_files:
#   - /etc/prometheus/rules/*.yml
